name: Update profile board

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-board
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Fetch live GitHub data
        run: node scripts/fetch-profile-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render board and README
        run: node scripts/render-profile.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "no changes — profile already current"
            exit 0
          fi
          git config user.name "batu"
          git config user.email "batu3384@gmail.com"
          git add README.md assets data
          git commit -m "chore: refresh profile board data [skip ci]"
          git push

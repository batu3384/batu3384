    <text x="46" y="148" class="display" font-size="46" fill="#F7F1E8">Software</text>
    <text x="46" y="198" class="display" font-size="46" fill="#F7F1E8">builder</text>
    <text x="48" y="242" class="body" font-size="13" fill="#C4B4A4">LOCAL-FIRST APPS AND CLI TOOLS</text>
    <path d="M48 260H316" stroke="#C45C26" stroke-width="1" opacity=".35"/>
    <text x="48" y="292" class="mono" font-size="11" letter-spacing="1.2" fill="#F7F1E8">SWIFT · GO · TS · PYTHON · RUST</text>
    <text x="48" y="336" class="mono" font-size="12" letter-spacing="1.6" fill="#E8B86D">ISTANBUL · MIS</text>
  </g>
  <g class="rise">
        <rect x="372" y="40" width="556" height="96" rx="16" fill="#FFFFFF"/>
        <text x="900" y="110" class="display" font-size="64" text-anchor="end" fill="#D9CBBA" opacity=".55">01</text>
        <text x="396" y="72" class="mono" font-size="11" letter-spacing="1.8" fill="#9A3412">CAPTURE  ·  SWIFT</text>
        <text x="396" y="100" class="body" font-size="22" font-weight="700" fill="#1A1714">ScreenTextGrab</text>
        <text x="396" y="122" class="body" font-size="13" fill="#6B5A4A">Menu bar OCR for screen, code, tables, PDFs.</text>
      </g><g class="rise">
        <rect x="372" y="148" width="556" height="96" rx="16" fill="#FFFFFF"/>
        <text x="900" y="218" class="display" font-size="64" text-anchor="end" fill="#D9CBBA" opacity=".55">02</text>
        <text x="396" y="180" class="mono" font-size="11" letter-spacing="1.8" fill="#9A3412">WORKSPACE  ·  TYPESCRIPT</text>
        <text x="396" y="208" class="body" font-size="22" font-weight="700" fill="#1A1714">calder</text>
        <text x="396" y="230" class="body" font-size="13" fill="#6B5A4A">Parallel Claude, Codex, Cursor, Antigravity.</text>
      </g><g class="rise">
        <rect x="372" y="256" width="556" height="96" rx="16" fill="#FFFFFF"/>
        <text x="900" y="326" class="display" font-size="64" text-anchor="end" fill="#D9CBBA" opacity=".55">03</text>
        <text x="396" y="288" class="mono" font-size="11" letter-spacing="1.8" fill="#9A3412">TRANSFER  ·  RUST</text>
        <text x="396" y="316" class="body" font-size="22" font-weight="700" fill="#1A1714">frostwall-beam</text>
        <text x="396" y="338" class="body" font-size="13" fill="#6B5A4A">Encrypted transfer with a receiver gate.</text>

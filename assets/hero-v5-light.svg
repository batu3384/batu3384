<svg xmlns="http://www.w3.org/2000/svg" width="960" height="392" viewBox="0 0 960 392" role="img" aria-label="Batuhan Yüksel, software builder. Selected work: ScreenTextGrab, calder, frostwall-beam." data-mode="light">
  <style>
    .display{font-family:Georgia,"Times New Roman",serif}
    .body{font-family:"Avenir Next",Avenir,Helvetica,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .rise{animation:rise .45s ease-out}
    @keyframes rise{from{opacity:.2}to{opacity:1}}
    @media(prefers-reduced-motion:reduce){.rise{animation:none}}
  </style>
  <rect width="960" height="392" fill="#E6DCCF"/>
  <rect x="12" y="12" width="936" height="368" rx="24" fill="#F7F1E8"/>
  <g class="rise">

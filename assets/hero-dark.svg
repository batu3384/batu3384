<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="Batuhan Yüksel, software developer. ScreenTextGrab, calder, frostwall-beam." data-mode="dark">
  <defs>
    <pattern id="dark-perf" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.15" fill="#30494C" opacity=".5"/></pattern>
  </defs>
  <style>
    .display{font-family:"Arial Narrow","Avenir Next Condensed",Impact,sans-serif}
    .body{font-family:"Avenir Next",Avenir,Helvetica,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .boot{animation:boot .45s cubic-bezier(.2,.8,.2,1)}
    .signal{stroke-dasharray:4 8;animation:signal 7s linear infinite}
    .dial{transform-box:fill-box;transform-origin:center;animation:dial 14s linear infinite}
    @keyframes boot{from{opacity:.3}to{opacity:1}}
    @keyframes signal{to{stroke-dashoffset:-120}}
    @keyframes dial{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.boot,.signal,.dial{animation:none}}
  </style>
  <rect width="960" height="430" fill="#080B0D"/>
  <rect x="12" y="12" width="936" height="406" rx="14" fill="#101619" stroke="#30494C"/>
  <rect x="12" y="12" width="936" height="406" rx="14" fill="url(#dark-perf)"/>
  <path d="M368 107H374V107H386" fill="none" stroke="#30494C" stroke-width="2"/>
  <path class="signal" d="M368 107H374V107H386" fill="none" stroke="#22D3EE"/>
  <g class="boot">
    <path d="M28 28H340L358 46V332H28Z" fill="#182125" stroke="#30494C"/>
    <rect x="28" y="28" width="7" height="304" fill="#22D3EE"/>
    <text x="50" y="60" class="mono" font-size="11" letter-spacing="2.1" fill="#22D3EE">BATUHAN YÜKSEL</text>
    <text x="50" y="130" class="display" font-size="44" font-weight="900" letter-spacing="-1" fill="#EEF6F4">SOFTWARE</text>
    <text x="50" y="174" class="display" font-size="44" font-weight="900" letter-spacing="-1" fill="#EEF6F4">BUILDER</text>
    <text x="50" y="214" class="body" font-size="12" fill="#8BA19F">LOCAL-FIRST SOFTWARE · PRIVACY-AWARE TOOLS</text>
    <path d="M50 232H330" stroke="#30494C"/>
    <text x="50" y="258" class="mono" font-size="10" letter-spacing="1.2" fill="#EEF6F4">SWIFT · GO · TYPESCRIPT · PYTHON · RUST</text>
    <g transform="translate(310 300)">
      <circle r="20" fill="#202C31" stroke="#30494C"/>
      <circle class="dial" r="13" fill="none" stroke="#3B82F6" stroke-width="3" stroke-dasharray="5 5"/>
      <circle r="4" fill="#3B82F6"/>
    </g>
    <text x="50" y="308" class="mono" font-size="10" letter-spacing="1.2" fill="#22D3EE">ISTANBUL · MIS</text>
  </g>
  <text x="386" y="48" class="mono" font-size="10" letter-spacing="1.8" fill="#8BA19F">SELECTED SYSTEMS  /  03</text>
  <g class="boot" style="animation-delay:100ms">
        <path d="M386 68H914L932 86V146H386Z" fill="#182125" stroke="#30494C"/>
        <rect x="386" y="68" width="6" height="78" fill="#22D3EE"/>
        <text x="408" y="93" class="mono" font-size="11" letter-spacing="1.4" fill="#22D3EE">01  /  macOS · OCR</text>
        <text x="408" y="121" class="body" font-size="21" font-weight="800" fill="#EEF6F4">ScreenTextGrab</text>
        <text x="408" y="138" class="body" font-size="12" fill="#8BA19F">Capture anything visual as usable text.</text>
      </g><g class="boot" style="animation-delay:180ms">
        <path d="M386 158H914L932 176V236H386Z" fill="#182125" stroke="#30494C"/>
        <rect x="386" y="158" width="6" height="78" fill="#22D3EE"/>
        <text x="408" y="183" class="mono" font-size="11" letter-spacing="1.4" fill="#22D3EE">02  /  AI · WORKSPACE</text>
        <text x="408" y="211" class="body" font-size="21" font-weight="800" fill="#EEF6F4">calder</text>
        <text x="408" y="228" class="body" font-size="12" fill="#8BA19F">Run parallel coding CLIs in one workspace.</text>
      </g><g class="boot" style="animation-delay:260ms">
        <path d="M386 248H914L932 266V326H386Z" fill="#182125" stroke="#30494C"/>
        <rect x="386" y="248" width="6" height="78" fill="#3B82F6"/>
        <text x="408" y="273" class="mono" font-size="11" letter-spacing="1.4" fill="#3B82F6">03  /  SECURE · TRANSFER</text>
        <text x="408" y="301" class="body" font-size="21" font-weight="800" fill="#EEF6F4">frostwall-beam</text>
        <text x="408" y="318" class="body" font-size="12" fill="#8BA19F">Encrypted transfer with receiver approval.</text>
      </g>
  <text x="28" y="344" class="mono" font-size="10" letter-spacing="1.8" fill="#8BA19F">MORE IN THE STACK  /  04</text>
  <g class="boot" style="animation-delay:220ms">
        <path d="M28 354H224L242 372V402H28Z" fill="#202C31" stroke="#30494C"/>
        <rect x="28" y="354" width="5" height="48" fill="#22D3EE"/>
        <text x="46" y="375" class="body" font-size="14" font-weight="800" fill="#EEF6F4">sift</text>
        <text x="46" y="392" class="mono" font-size="9" letter-spacing="1" fill="#8BA19F">Terminal cleaner</text>
      </g><g class="boot" style="animation-delay:260ms">
        <path d="M252 354H448L466 372V402H252Z" fill="#202C31" stroke="#30494C"/>
        <rect x="252" y="354" width="5" height="48" fill="#3B82F6"/>
        <text x="270" y="375" class="body" font-size="14" font-weight="800" fill="#EEF6F4">ironsentinel</text>
        <text x="270" y="392" class="mono" font-size="9" letter-spacing="1" fill="#8BA19F">AppSec CLI</text>
      </g><g class="boot" style="animation-delay:300ms">
        <path d="M476 354H672L690 372V402H476Z" fill="#202C31" stroke="#30494C"/>
        <rect x="476" y="354" width="5" height="48" fill="#22D3EE"/>
        <text x="494" y="375" class="body" font-size="14" font-weight="800" fill="#EEF6F4">falcon-dm</text>
        <text x="494" y="392" class="mono" font-size="9" letter-spacing="1" fill="#8BA19F">Download manager</text>
      </g><g class="boot" style="animation-delay:340ms">
        <path d="M700 354H896L914 372V402H700Z" fill="#202C31" stroke="#30494C"/>
        <rect x="700" y="354" width="5" height="48" fill="#3B82F6"/>
        <text x="718" y="375" class="body" font-size="14" font-weight="800" fill="#EEF6F4">deskward</text>
        <text x="718" y="392" class="mono" font-size="9" letter-spacing="1" fill="#8BA19F">Remote desktop</text>
      </g>
</svg>
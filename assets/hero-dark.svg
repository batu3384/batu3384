<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Batuhan Yüksel, software developer. ScreenTextGrab, calder, frostwall-beam." data-mode="dark">
  <defs>
    <pattern id="dark-perf" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.15" fill="#30494C" opacity=".5"/></pattern>
    <linearGradient id="dark-glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101619"/><stop offset=".62" stop-color="#101619"/><stop offset="1" stop-color="#22D3EE" stop-opacity=".08"/></linearGradient>
    <filter id="dark-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000000" flood-opacity=".34"/></filter>
  </defs>
  <style>
    .display{font-family:"Arial Narrow","Avenir Next Condensed",Impact,sans-serif}
    .body{font-family:"Avenir Next",Avenir,Helvetica,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .boot{animation:boot .65s cubic-bezier(.2,.8,.2,1)}
    .signal{stroke-dasharray:4 8;animation:signal 7s linear infinite}
    .dial{transform-box:fill-box;transform-origin:center;animation:dial 14s linear infinite}
    @keyframes boot{from{opacity:.3;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes signal{to{stroke-dashoffset:-120}}
    @keyframes dial{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.boot,.signal,.dial{animation:none}}
  </style>
  <rect width="1200" height="480" fill="#080B0D"/>
  <rect x="10" y="10" width="1180" height="460" rx="14" fill="url(#dark-glow)" stroke="#30494C"/>
  <rect x="10" y="10" width="1180" height="460" rx="14" fill="url(#dark-perf)"/>
  <path d="M690 56H706V76H724M690 174H706V194H724M690 292H706V312H724" fill="none" stroke="#30494C" stroke-width="2"/>
  <path class="signal" d="M690 56H706V76H724M690 174H706V194H724M690 292H706V312H724" fill="none" stroke="#22D3EE"/>
  <g class="boot" filter="url(#dark-shadow)">
    <path d="M24 24H672L690 42V372H24Z" fill="#182125" stroke="#30494C"/>
    <rect x="24" y="24" width="8" height="348" fill="#22D3EE"/>
    <text x="54" y="58" class="mono" font-size="13" letter-spacing="2.4" fill="#22D3EE">BATUHAN YÜKSEL</text>
    <text x="50" y="128" class="display" font-size="52" font-weight="900" letter-spacing="-1" fill="#EEF6F4">SOFTWARE</text>
    <text x="50" y="182" class="display" font-size="52" font-weight="900" letter-spacing="-1" fill="#EEF6F4">DEVELOPER</text>
    <text x="54" y="228" class="body" font-size="16" fill="#8BA19F">macOS apps · terminal tools · AppSec · AI workspaces</text>
    <path d="M54 248H430" stroke="#30494C"/>
    <text x="54" y="276" class="mono" font-size="12" letter-spacing="1.6" fill="#EEF6F4">SWIFT · GO · TYPESCRIPT · PYTHON · RUST</text>
    <g transform="translate(620 92)">
      <circle r="40" fill="#202C31" stroke="#30494C"/>
      <circle class="dial" r="28" fill="none" stroke="#3B82F6" stroke-width="4" stroke-dasharray="8 7"/>
      <circle r="9" fill="#3B82F6"/>
      <path d="M0-22V-34" stroke="#EEF6F4" stroke-width="2"/>
    </g>
    <g transform="translate(54 308)">
      <path d="M0 0H170L188 18V44H0Z" fill="#202C31" stroke="#30494C"/>
      <text x="16" y="28" class="mono" font-size="12" font-weight="700" fill="#22D3EE">ISTANBUL · MIS</text>
    </g>
  </g>
  <g class="boot" style="animation-delay:100ms" filter="url(#dark-shadow)">
        <path d="M724 28H1158L1176 46V132H724Z" fill="#182125" stroke="#30494C"/>
        <path d="M724 36H760" stroke="#22D3EE" stroke-width="4"/>
        <text x="748" y="64" class="mono" font-size="12" letter-spacing="1.6" fill="#22D3EE">01  /  MACOS OCR</text>
        <text x="748" y="92" class="body" font-size="20" font-weight="800" fill="#EEF6F4">ScreenTextGrab</text>
        <text x="748" y="116" class="body" font-size="13" fill="#8BA19F">On-device OCR for screen, files, and PDFs.</text>
      </g><g class="boot" style="animation-delay:180ms" filter="url(#dark-shadow)">
        <path d="M724 146H1158L1176 164V250H724Z" fill="#182125" stroke="#30494C"/>
        <path d="M724 154H808" stroke="#22D3EE" stroke-width="4"/>
        <text x="748" y="182" class="mono" font-size="12" letter-spacing="1.6" fill="#22D3EE">02  /  AI WORKSPACE</text>
        <text x="748" y="210" class="body" font-size="20" font-weight="800" fill="#EEF6F4">calder</text>
        <text x="748" y="234" class="body" font-size="13" fill="#8BA19F">Parallel AI coding CLIs in one Electron shell.</text>
      </g><g class="boot" style="animation-delay:260ms" filter="url(#dark-shadow)">
        <path d="M724 264H1158L1176 282V368H724Z" fill="#182125" stroke="#30494C"/>
        <path d="M724 272H856" stroke="#3B82F6" stroke-width="4"/>
        <text x="748" y="300" class="mono" font-size="12" letter-spacing="1.6" fill="#3B82F6">03  /  FILE TRANSFER</text>
        <text x="748" y="328" class="body" font-size="20" font-weight="800" fill="#EEF6F4">frostwall-beam</text>
        <text x="748" y="352" class="body" font-size="13" fill="#8BA19F">Encrypted LAN/internet transfer, receiver approval.</text>
      </g>
  <g class="boot" style="animation-delay:220ms" filter="url(#dark-shadow)">
        <path d="M24 392H288L306 410V456H24Z" fill="#202C31" stroke="#30494C"/>
        <rect x="24" y="392" width="5" height="64" fill="#22D3EE"/>
        <text x="46" y="416" class="body" font-size="15" font-weight="800" fill="#EEF6F4">sift</text>
        <text x="46" y="438" class="mono" font-size="11" letter-spacing="1.2" fill="#8BA19F">TERMINAL CLEANER</text>
      </g><g class="boot" style="animation-delay:260ms" filter="url(#dark-shadow)">
        <path d="M318 392H582L600 410V456H318Z" fill="#202C31" stroke="#30494C"/>
        <rect x="318" y="392" width="5" height="64" fill="#3B82F6"/>
        <text x="340" y="416" class="body" font-size="15" font-weight="800" fill="#EEF6F4">ironsentinel</text>
        <text x="340" y="438" class="mono" font-size="11" letter-spacing="1.2" fill="#8BA19F">APPSEC CLI</text>
      </g><g class="boot" style="animation-delay:300ms" filter="url(#dark-shadow)">
        <path d="M612 392H876L894 410V456H612Z" fill="#202C31" stroke="#30494C"/>
        <rect x="612" y="392" width="5" height="64" fill="#22D3EE"/>
        <text x="634" y="416" class="body" font-size="15" font-weight="800" fill="#EEF6F4">falcon-dm</text>
        <text x="634" y="438" class="mono" font-size="11" letter-spacing="1.2" fill="#8BA19F">DOWNLOAD MANAGER</text>
      </g><g class="boot" style="animation-delay:340ms" filter="url(#dark-shadow)">
        <path d="M906 392H1170L1188 410V456H906Z" fill="#202C31" stroke="#30494C"/>
        <rect x="906" y="392" width="5" height="64" fill="#3B82F6"/>
        <text x="928" y="416" class="body" font-size="15" font-weight="800" fill="#EEF6F4">deskward</text>
        <text x="928" y="438" class="mono" font-size="11" letter-spacing="1.2" fill="#8BA19F">REMOTE DESKTOP</text>
      </g>
</svg>
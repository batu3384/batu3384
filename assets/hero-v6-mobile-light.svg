<svg xmlns="http://www.w3.org/2000/svg" width="400" height="860" viewBox="0 0 400 860" role="img" aria-label="Batuhan Yüksel, software developer. Selected work: ScreenTextGrab, calder, ironsentinel." data-mode="mlight">
  <style>
    .display,.body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
    .rise{animation:rise .45s ease-out}
    @keyframes rise{from{opacity:.2}to{opacity:1}}
    @media(prefers-reduced-motion:reduce){.rise{animation:none}}
  </style>
  <rect width="400" height="860" fill="#ffffff"/>
  <g class="rise">
    <rect x="18" y="18" width="364" height="148" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="36" y="48" class="mono" font-size="12" fill="#59636e">Batuhan Yüksel</text>
    <text x="36" y="88" class="display" font-size="24" font-weight="600" fill="#1f2328">Software developer</text>
    <text x="36" y="122" class="body" font-size="13" fill="#59636e">macOS · terminal · AppSec</text>
  </g>
  <g class="rise">
        <rect x="18" y="186" width="364" height="198" rx="6" fill="#ffffff" stroke="#d1d9e0"/>
        <circle cx="40" cy="222" r="4" fill="#F05138"/>
        <text x="52" y="226" class="mono" font-size="13" fill="#59636e">Swift</text>
        <text x="40" y="278" class="body" font-size="22" font-weight="600" fill="#0969da">ScreenTextGrab</text>
        <text x="40" y="318" class="body" font-size="15" fill="#59636e">Menu bar OCR for screen, code, tables, PDFs.</text>
      </g><g class="rise">
        <rect x="18" y="400" width="364" height="198" rx="6" fill="#ffffff" stroke="#d1d9e0"/>
        <circle cx="40" cy="436" r="4" fill="#3178C6"/>
        <text x="52" y="440" class="mono" font-size="13" fill="#59636e">TypeScript</text>
        <text x="40" y="492" class="body" font-size="22" font-weight="600" fill="#0969da">calder</text>
        <text x="40" y="532" class="body" font-size="15" fill="#59636e">Parallel Claude, Codex, Cursor, Antigravity.</text>
      </g><g class="rise">
        <rect x="18" y="614" width="364" height="198" rx="6" fill="#ffffff" stroke="#d1d9e0"/>
        <circle cx="40" cy="650" r="4" fill="#00ADD8"/>
        <text x="52" y="654" class="mono" font-size="13" fill="#59636e">Go</text>
        <text x="40" y="706" class="body" font-size="22" font-weight="600" fill="#0969da">ironsentinel</text>
        <text x="40" y="746" class="body" font-size="15" fill="#59636e">Guided scans, trust checks, evidence reports.</text>
      </g>
</svg>
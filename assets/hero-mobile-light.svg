<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1020" viewBox="0 0 800 1020" role="img" aria-label="Batuhan Yüksel software developer" data-mode="mlight">
  <defs>
    <pattern id="mlight-perf" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.15" fill="#B5C6C2" opacity=".5"/></pattern>
    <linearGradient id="mlight-glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EDF1EC"/><stop offset=".62" stop-color="#EDF1EC"/><stop offset="1" stop-color="#22D3EE" stop-opacity=".08"/></linearGradient>
    <filter id="mlight-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#9AA8A4" flood-opacity=".34"/></filter>
  </defs>
  <style>
    .display{font-family:"Arial Narrow","Avenir Next Condensed",Impact,sans-serif}
    .body{font-family:"Avenir Next",Avenir,Helvetica,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .boot{animation:boot .65s cubic-bezier(.2,.8,.2,1)}
    .signal{stroke-dasharray:4 8;animation:signal 7s linear infinite}
    .dial{transform-box:fill-box;transform-origin:center;animation:dial 14s linear infinite}
    @keyframes boot{from{opacity:.3;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes signal{to{stroke-dashoffset:-120}}
    @keyframes dial{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.boot,.signal,.dial{animation:none}}
  </style>
  <rect width="800" height="1020" fill="#DCE2DE"/>
  <rect x="12" y="12" width="776" height="996" rx="18" fill="url(#mlight-glow)" stroke="#B5C6C2"/>
  <rect x="12" y="12" width="776" height="996" rx="18" fill="url(#mlight-perf)"/>
  <g class="boot" filter="url(#mlight-shadow)">
    <path d="M28 28H754L772 46V248H28Z" fill="#F8FAF5" stroke="#B5C6C2"/>
    <rect x="28" y="28" width="10" height="220" fill="#22D3EE"/>
    <text x="58" y="72" class="mono" font-size="18" letter-spacing="2.4" fill="#22D3EE">BATUHAN YÜKSEL  ·  ISTANBUL</text>
    <text x="54" y="128" class="display" font-size="44" font-weight="900" fill="#142022">SOFTWARE DEVELOPER</text>
    <text x="58" y="176" class="body" font-size="20" fill="#627471">macOS apps · terminal · AppSec · AI tools</text>
    <text x="58" y="214" class="mono" font-size="16" fill="#142022">SWIFT · GO · TS · PYTHON · RUST</text>
  </g>
  <g class="boot" style="animation-delay:80ms" filter="url(#mlight-shadow)">
        <path d="M28 268H754L772 286V420H28Z" fill="#F8FAF5" stroke="#B5C6C2"/>
        <rect x="28" y="268" width="8" height="152" fill="#22D3EE"/>
        <text x="56" y="310" class="mono" font-size="20" letter-spacing="2" fill="#22D3EE">01  /  MACOS OCR</text>
        <text x="56" y="354" class="body" font-size="32" font-weight="800" fill="#142022">ScreenTextGrab</text>
        <text x="56" y="392" class="body" font-size="20" fill="#627471">On-device capture for screen, files, and PDFs.</text>
      </g><g class="boot" style="animation-delay:150ms" filter="url(#mlight-shadow)">
        <path d="M28 436H754L772 454V588H28Z" fill="#F8FAF5" stroke="#B5C6C2"/>
        <rect x="28" y="436" width="8" height="152" fill="#22D3EE"/>
        <text x="56" y="478" class="mono" font-size="20" letter-spacing="2" fill="#22D3EE">02  /  AI WORKSPACE</text>
        <text x="56" y="522" class="body" font-size="32" font-weight="800" fill="#142022">calder</text>
        <text x="56" y="560" class="body" font-size="20" fill="#627471">Parallel coding CLI sessions in one Electron shell.</text>
      </g><g class="boot" style="animation-delay:220ms" filter="url(#mlight-shadow)">
        <path d="M28 604H754L772 622V756H28Z" fill="#F8FAF5" stroke="#B5C6C2"/>
        <rect x="28" y="604" width="8" height="152" fill="#3B82F6"/>
        <text x="56" y="646" class="mono" font-size="20" letter-spacing="2" fill="#3B82F6">03  /  FILE TRANSFER</text>
        <text x="56" y="690" class="body" font-size="32" font-weight="800" fill="#142022">frostwall-beam</text>
        <text x="56" y="728" class="body" font-size="20" fill="#627471">Encrypted LAN and internet send with receiver approval.</text>
      </g>
  <g class="boot" filter="url(#mlight-shadow)">
        <path d="M28 788H370L388 806V884H28Z" fill="#FFFFFF" stroke="#B5C6C2"/>
        <text x="52" y="830" class="body" font-size="24" font-weight="800" fill="#142022">sift</text>
        <text x="52" y="860" class="mono" font-size="16" fill="#627471">TERMINAL CLEANER</text>
      </g><g class="boot" filter="url(#mlight-shadow)">
        <path d="M400 788H742L760 806V884H400Z" fill="#FFFFFF" stroke="#B5C6C2"/>
        <text x="424" y="830" class="body" font-size="24" font-weight="800" fill="#142022">ironsentinel</text>
        <text x="424" y="860" class="mono" font-size="16" fill="#627471">APPSEC CLI</text>
      </g><g class="boot" filter="url(#mlight-shadow)">
        <path d="M28 900H370L388 918V996H28Z" fill="#FFFFFF" stroke="#B5C6C2"/>
        <text x="52" y="942" class="body" font-size="24" font-weight="800" fill="#142022">falcon-dm</text>
        <text x="52" y="972" class="mono" font-size="16" fill="#627471">DOWNLOAD MANAGER</text>
      </g><g class="boot" filter="url(#mlight-shadow)">
        <path d="M400 900H742L760 918V996H400Z" fill="#FFFFFF" stroke="#B5C6C2"/>
        <text x="424" y="942" class="body" font-size="24" font-weight="800" fill="#142022">deskward</text>
        <text x="424" y="972" class="mono" font-size="16" fill="#627471">REMOTE DESKTOP</text>
      </g>
</svg>
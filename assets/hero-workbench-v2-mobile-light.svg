<svg xmlns="http://www.w3.org/2000/svg" width="640" height="900" viewBox="0 0 640 900" role="img" aria-label="Batuhan Yüksel, software developer. ScreenTextGrab, calder, frostwall-beam." data-mode="mlight">
  <defs>
    <pattern id="mlight-perf" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.15" fill="#B5C6C2" opacity=".5"/></pattern>
  </defs>
  <style>
    .display{font-family:"Arial Narrow","Avenir Next Condensed",Impact,sans-serif}
    .body{font-family:"Avenir Next",Avenir,Helvetica,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .boot{animation:boot .45s cubic-bezier(.2,.8,.2,1)}
    .signal{stroke-dasharray:4 8;animation:signal 7s linear infinite}
    .dial{transform-box:fill-box;transform-origin:center;animation:dial 14s linear infinite}
    @keyframes boot{from{opacity:.3}to{opacity:1}}
    @keyframes signal{to{stroke-dashoffset:-120}}
    @keyframes dial{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.boot,.signal,.dial{animation:none}}
  </style>
  <rect width="640" height="900" fill="#DCE2DE"/>
  <rect x="12" y="12" width="616" height="876" rx="18" fill="#EDF1EC" stroke="#B5C6C2"/>
  <rect x="12" y="12" width="616" height="876" rx="18" fill="url(#mlight-perf)"/>
  <g class="boot">
    <path d="M28 28H594L612 46V220H28Z" fill="#F8FAF5" stroke="#B5C6C2"/>
    <rect x="28" y="28" width="9" height="192" fill="#0E7490"/>
    <text x="58" y="66" class="mono" font-size="16" letter-spacing="2.2" fill="#0E7490">BATUHAN YÜKSEL  ·  ISTANBUL</text>
    <text x="54" y="116" class="display" font-size="38" font-weight="900" fill="#142022">SOFTWARE</text>
    <text x="54" y="156" class="display" font-size="38" font-weight="900" fill="#142022">BUILDER</text>
    <text x="58" y="190" class="body" font-size="13" fill="#4B5C59">LOCAL-FIRST SOFTWARE · PRIVACY-AWARE TOOLS</text>
  </g>
  <text x="28" y="232" class="mono" font-size="11" letter-spacing="1.8" fill="#4B5C59">SELECTED SYSTEMS  /  03</text>
  <g class="boot" style="animation-delay:80ms">
        <path d="M28 244H594L612 262V376H28Z" fill="#F8FAF5" stroke="#B5C6C2"/>
        <rect x="28" y="244" width="8" height="132" fill="#0E7490"/>
        <text x="56" y="279" class="mono" font-size="14" letter-spacing="1.8" fill="#0E7490">01  /  macOS · OCR</text>
        <text x="56" y="324" class="body" font-size="28" font-weight="800" fill="#142022">ScreenTextGrab</text>
        <text x="56" y="356" class="body" font-size="16" fill="#4B5C59">Capture anything visual as usable text.</text>
      </g><g class="boot" style="animation-delay:150ms">
        <path d="M28 394H594L612 412V526H28Z" fill="#F8FAF5" stroke="#B5C6C2"/>
        <rect x="28" y="394" width="8" height="132" fill="#0E7490"/>
        <text x="56" y="429" class="mono" font-size="14" letter-spacing="1.8" fill="#0E7490">02  /  AI · WORKSPACE</text>
        <text x="56" y="474" class="body" font-size="28" font-weight="800" fill="#142022">calder</text>
        <text x="56" y="506" class="body" font-size="16" fill="#4B5C59">Run parallel coding CLIs in one workspace.</text>
      </g><g class="boot" style="animation-delay:220ms">
        <path d="M28 544H594L612 562V676H28Z" fill="#F8FAF5" stroke="#B5C6C2"/>
        <rect x="28" y="544" width="8" height="132" fill="#1D4ED8"/>
        <text x="56" y="579" class="mono" font-size="14" letter-spacing="1.8" fill="#1D4ED8">03  /  SECURE · TRANSFER</text>
        <text x="56" y="624" class="body" font-size="28" font-weight="800" fill="#142022">frostwall-beam</text>
        <text x="56" y="656" class="body" font-size="16" fill="#4B5C59">Encrypted transfer with receiver approval.</text>
      </g>
  <text x="28" y="698" class="mono" font-size="11" letter-spacing="1.8" fill="#4B5C59">MORE IN THE STACK  /  04</text>
  <g class="boot">
        <path d="M28 710H294L312 728V762H28Z" fill="#FFFFFF" stroke="#B5C6C2"/>
        <text x="48" y="734" class="body" font-size="16" font-weight="800" fill="#142022">sift</text>
        <text x="48" y="752" class="mono" font-size="10" letter-spacing="1" fill="#4B5C59">Terminal cleaner</text>
      </g><g class="boot">
        <path d="M332 710H598L616 728V762H332Z" fill="#FFFFFF" stroke="#B5C6C2"/>
        <text x="352" y="734" class="body" font-size="16" font-weight="800" fill="#142022">ironsentinel</text>
        <text x="352" y="752" class="mono" font-size="10" letter-spacing="1" fill="#4B5C59">AppSec CLI</text>
      </g><g class="boot">
        <path d="M28 776H294L312 794V828H28Z" fill="#FFFFFF" stroke="#B5C6C2"/>
        <text x="48" y="800" class="body" font-size="16" font-weight="800" fill="#142022">falcon-dm</text>
        <text x="48" y="818" class="mono" font-size="10" letter-spacing="1" fill="#4B5C59">Download manager</text>
      </g><g class="boot">
        <path d="M332 776H598L616 794V828H332Z" fill="#FFFFFF" stroke="#B5C6C2"/>
        <text x="352" y="800" class="body" font-size="16" font-weight="800" fill="#142022">deskward</text>
        <text x="352" y="818" class="mono" font-size="10" letter-spacing="1" fill="#4B5C59">Remote desktop</text>
      </g>
  <text x="28" y="858" class="mono" font-size="11" letter-spacing="1.5" fill="#0E7490">SWIFT · GO · TYPESCRIPT · PYTHON · RUST</text>
</svg>
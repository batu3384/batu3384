<svg xmlns="http://www.w3.org/2000/svg" width="960" height="392" viewBox="0 0 960 392" role="img" aria-label="Batuhan Yüksel, software developer. Selected work: ScreenTextGrab, calder, ironsentinel." data-mode="dark">
  <style>
    .display,.body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
    .rise{animation:rise .45s ease-out}
    @keyframes rise{from{opacity:.2}to{opacity:1}}
    @media(prefers-reduced-motion:reduce){.rise{animation:none}}
  </style>
  <rect width="960" height="392" fill="#0d1117"/>
  <g class="rise">
    <rect x="24" y="24" width="328" height="220" rx="6" fill="#161b22" stroke="#3d444d"/>
    <text x="44" y="56" class="mono" font-size="12" fill="#9198a1">Batuhan Yüksel</text>
    <text x="44" y="100" class="display" font-size="24" font-weight="600" fill="#e6edf3">Software developer</text>
    <text x="44" y="136" class="body" font-size="14" fill="#9198a1">macOS · terminal · AppSec</text>
    <path d="M44 160H328" stroke="#3d444d" stroke-width="1"/>
    <text x="44" y="192" class="mono" font-size="12" fill="#e6edf3">Swift · Go · TS · Python · Rust</text>
    <text x="44" y="224" class="body" font-size="13" fill="#9198a1">Istanbul · MIS</text>
  </g>
  <g class="rise">
        <rect x="372" y="40" width="556" height="96" rx="6" fill="#161b22" stroke="#3d444d"/>
        <circle cx="392" cy="68" r="4" fill="#F05138"/>
        <text x="404" y="72" class="mono" font-size="12" fill="#9198a1">Swift</text>
        <text x="390" y="98" class="body" font-size="16" font-weight="600" fill="#4493f8">ScreenTextGrab</text>
        <text x="390" y="120" class="body" font-size="13" fill="#9198a1">Menu bar OCR for screen, code, tables, PDFs.</text>
      </g><g class="rise">
        <rect x="372" y="148" width="556" height="96" rx="6" fill="#161b22" stroke="#3d444d"/>
        <circle cx="392" cy="176" r="4" fill="#3178C6"/>
        <text x="404" y="180" class="mono" font-size="12" fill="#9198a1">TypeScript</text>
        <text x="390" y="206" class="body" font-size="16" font-weight="600" fill="#4493f8">calder</text>
        <text x="390" y="228" class="body" font-size="13" fill="#9198a1">Parallel Claude, Codex, Cursor, Antigravity.</text>
      </g><g class="rise">
        <rect x="372" y="256" width="556" height="96" rx="6" fill="#161b22" stroke="#3d444d"/>
        <circle cx="392" cy="284" r="4" fill="#00ADD8"/>
        <text x="404" y="288" class="mono" font-size="12" fill="#9198a1">Go</text>
        <text x="390" y="314" class="body" font-size="16" font-weight="600" fill="#4493f8">ironsentinel</text>
        <text x="390" y="336" class="body" font-size="13" fill="#9198a1">Guided scans, trust checks, evidence reports.</text>
      </g>
</svg>
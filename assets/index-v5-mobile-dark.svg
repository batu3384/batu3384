<svg xmlns="http://www.w3.org/2000/svg" width="400" height="360" viewBox="0 0 400 360" role="img" aria-label="Supporting work: sift, ironsentinel, falcon-dm, deskward." data-mode="imidark">
  <style>
    .display{font-family:Georgia,"Times New Roman",serif}
    .body{font-family:"Avenir Next",Avenir,Helvetica,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .rise{animation:rise .45s ease-out}
    @keyframes rise{from{opacity:.2}to{opacity:1}}
    @media(prefers-reduced-motion:reduce){.rise{animation:none}}
  </style>
  <rect width="400" height="360" fill="#12100E"/>
  <rect x="8" y="8" width="384" height="344" rx="20" fill="#1A1714"/>
  <text x="18" y="34" class="mono" font-size="12" letter-spacing="1.6" fill="#B7A798">OPERATOR STACK</text>
  <g class="rise">
        <rect x="18" y="48" width="176" height="136" rx="16" fill="#2A241F"/>
        <rect x="32" y="48" width="148" height="3" fill="#C45C26"/>
        <text x="32" y="92" class="mono" font-size="12" letter-spacing="1.2" fill="#E8B86D">MAINTAIN</text>
        <text x="32" y="138" class="body" font-size="18" font-weight="700" fill="#F6EFE6">sift</text>
      </g><g class="rise">
        <rect x="206" y="48" width="176" height="136" rx="16" fill="#2A241F"/>
        <rect x="220" y="48" width="148" height="3" fill="#C45C26"/>
        <text x="220" y="92" class="mono" font-size="12" letter-spacing="1.2" fill="#E8B86D">SECURE</text>
        <text x="220" y="138" class="body" font-size="18" font-weight="700" fill="#F6EFE6">ironsentinel</text>
      </g><g class="rise">
        <rect x="18" y="196" width="176" height="136" rx="16" fill="#2A241F"/>
        <rect x="32" y="196" width="148" height="3" fill="#C45C26"/>
        <text x="32" y="240" class="mono" font-size="12" letter-spacing="1.2" fill="#E8B86D">FETCH</text>
        <text x="32" y="286" class="body" font-size="18" font-weight="700" fill="#F6EFE6">falcon-dm</text>
      </g><g class="rise">
        <rect x="206" y="196" width="176" height="136" rx="16" fill="#2A241F"/>
        <rect x="220" y="196" width="148" height="3" fill="#C45C26"/>
        <text x="220" y="240" class="mono" font-size="12" letter-spacing="1.2" fill="#E8B86D">REMOTE</text>
        <text x="220" y="286" class="body" font-size="18" font-weight="700" fill="#F6EFE6">deskward</text>
      </g>
</svg>
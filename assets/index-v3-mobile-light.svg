<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-label="Supporting work: sift, ironsentinel, falcon-dm, deskward." data-mode="imilight">
  <defs>
    <pattern id="imilight-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#B7C6C2" stroke-width=".6" opacity=".45"/>
    </pattern>
  </defs>
  <style>
    .display{font-family:"Arial Narrow","Avenir Next Condensed",Impact,sans-serif}
    .body{font-family:"Avenir Next",Avenir,Helvetica,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .boot{animation:boot .4s ease-out}
    .scan{stroke-dasharray:5 9;animation:scan 8s linear infinite}
    @keyframes boot{from{opacity:.25}to{opacity:1}}
    @keyframes scan{to{stroke-dashoffset:-140}}
    @media(prefers-reduced-motion:reduce){.boot,.scan{animation:none}}
  </style>
  <rect width="640" height="320" fill="#D7DDD8"/>
  <rect x="12" y="12" width="616" height="296" rx="16" fill="#EEF2ED" stroke="#B7C6C2"/>
  <text x="28" y="36" class="mono" font-size="14" letter-spacing="1.8" fill="#3F534F">OPERATOR STACK</text>
  <g class="boot">
        <path d="M28 48H296L312 64V164H28Z" fill="#FFFFFF" stroke="#B7C6C2"/>
        <rect x="28" y="48" width="7" height="116" fill="#0E7490"/>
        <text x="48" y="86" class="mono" font-size="14" letter-spacing="1.4" fill="#0E7490">MAINTAIN  ·  GO</text>
        <text x="48" y="128" class="body" font-size="24" font-weight="800" fill="#122024">sift</text>
      </g><g class="boot">
        <path d="M328 48H596L612 64V164H328Z" fill="#FFFFFF" stroke="#B7C6C2"/>
        <rect x="328" y="48" width="7" height="116" fill="#1D4ED8"/>
        <text x="348" y="86" class="mono" font-size="14" letter-spacing="1.4" fill="#1D4ED8">SECURE  ·  GO</text>
        <text x="348" y="128" class="body" font-size="24" font-weight="800" fill="#122024">ironsentinel</text>
      </g><g class="boot">
        <path d="M28 176H296L312 192V292H28Z" fill="#FFFFFF" stroke="#B7C6C2"/>
        <rect x="28" y="176" width="7" height="116" fill="#0E7490"/>
        <text x="48" y="214" class="mono" font-size="14" letter-spacing="1.4" fill="#0E7490">FETCH  ·  RUST</text>
        <text x="48" y="256" class="body" font-size="24" font-weight="800" fill="#122024">falcon-dm</text>
      </g><g class="boot">
        <path d="M328 176H596L612 192V292H328Z" fill="#FFFFFF" stroke="#B7C6C2"/>
        <rect x="328" y="176" width="7" height="116" fill="#1D4ED8"/>
        <text x="348" y="214" class="mono" font-size="14" letter-spacing="1.4" fill="#1D4ED8">REMOTE  ·  RUST</text>
        <text x="348" y="256" class="body" font-size="24" font-weight="800" fill="#122024">deskward</text>
      </g>
</svg>
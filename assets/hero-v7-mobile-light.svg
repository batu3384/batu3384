<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1040" viewBox="0 0 400 1040" role="img" aria-label="Batuhan Yüksel, local-first developer. ScreenTextGrab, calder, ironsentinel." data-mode="mlight">
  <defs>
    <radialGradient id="glow" cx="16%" cy="20%" r="42%">
      <stop offset="0" stop-color="#0969da" stop-opacity=".18"/>

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560" role="img" aria-label="Batuhan Yüksel. ScreenTextGrab, calder, ironsentinel, falcon-dm, frostwall-beam." data-mode="mdark">
  <defs>
    <clipPath id="frame"><rect width="400" height="560" rx="22"/></clipPath>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.65" fill="#d4a05a" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <style>
    .display{font-family:Georgia,"Times New Roman",Times,serif}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <g clip-path="url(#frame)">
    <rect width="400" height="560" fill="#12100e"/>
    <rect width="400" height="560" fill="url(#g)"/>
    <rect width="400" height="168" fill="#c48432"/>
    <text x="24" y="36" class="mono" font-size="10" letter-spacing="2.2" fill="#3d2a12">SOFTWARE</text>
    <text x="24" y="86" class="display" font-size="32" fill="#1a140c">Batuhan</text>
    <text x="24" y="124" class="display" font-size="32" fill="#1a140c">Yüksel</text>
    <text x="24" y="152" class="sans" font-size="13" fill="#1a140c">Software developer · Istanbul · MIS</text>
    <text x="28" y="214" class="mono" font-size="11" fill="#d4a05a">01</text>
    <text x="56" y="214" class="sans" font-size="15" font-weight="600" fill="#f6efe2">ScreenTextGrab</text>
    <text x="372" y="214" class="mono" font-size="11" text-anchor="end" fill="#b3a794">Swift</text>
    <text x="28" y="236" class="sans" font-size="12" fill="#b3a794">On-device OCR for screen, PDFs, code,</text>
    <text x="28" y="252" class="sans" font-size="12" fill="#b3a794">and tables.</text>
    <text x="28" y="272" class="mono" font-size="11" fill="#d4a05a">02</text>
    <text x="56" y="272" class="sans" font-size="15" font-weight="600" fill="#f6efe2">calder</text>
    <text x="372" y="272" class="mono" font-size="11" text-anchor="end" fill="#b3a794">TypeScript</text>
    <text x="28" y="294" class="sans" font-size="12" fill="#b3a794">Parallel Claude Code, Codex, Cursor,</text>
    <text x="28" y="310" class="sans" font-size="12" fill="#b3a794">and Antigravity.</text>
    <text x="28" y="330" class="mono" font-size="11" fill="#d4a05a">03</text>
    <text x="56" y="330" class="sans" font-size="15" font-weight="600" fill="#f6efe2">ironsentinel</text>
    <text x="372" y="330" class="mono" font-size="11" text-anchor="end" fill="#b3a794">Go</text>
    <text x="28" y="352" class="sans" font-size="12" fill="#b3a794">Guided scans, runtime trust checks,</text>
    <text x="28" y="368" class="sans" font-size="12" fill="#b3a794">evidence reports.</text>
    <text x="28" y="388" class="mono" font-size="11" fill="#d4a05a">04</text>
    <text x="56" y="388" class="sans" font-size="15" font-weight="600" fill="#f6efe2">falcon-dm</text>
    <text x="372" y="388" class="mono" font-size="11" text-anchor="end" fill="#b3a794">Rust</text>
    <text x="28" y="410" class="sans" font-size="12" fill="#b3a794">HTTP, HLS, and YouTube — native macOS,</text>
    <text x="28" y="426" class="sans" font-size="12" fill="#b3a794">local queue.</text>
    <text x="28" y="446" class="mono" font-size="11" fill="#d4a05a">05</text>
    <text x="56" y="446" class="sans" font-size="15" font-weight="600" fill="#f6efe2">frostwall-beam</text>
    <text x="372" y="446" class="mono" font-size="11" text-anchor="end" fill="#b3a794">Rust</text>
    <text x="28" y="468" class="sans" font-size="12" fill="#b3a794">Encrypted transfer with pairing and</text>
    <text x="28" y="484" class="sans" font-size="12" fill="#b3a794">receiver approval.</text>
    <text x="28" y="536" class="mono" font-size="11" fill="#b3a794">Swift · Go · TypeScript · Rust · Python · C++</text>
  </g>
</svg>
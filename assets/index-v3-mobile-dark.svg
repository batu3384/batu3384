<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-label="Supporting work: sift, ironsentinel, falcon-dm, deskward." data-mode="imidark">
  <defs>
    <pattern id="imidark-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2C4246" stroke-width=".6" opacity=".45"/>
    </pattern>
  </defs>
  <style>
    .display{font-family:"Arial Narrow","Avenir Next Condensed",Impact,sans-serif}
    .body{font-family:"Avenir Next",Avenir,Helvetica,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .boot{animation:boot .4s ease-out}
    .scan{stroke-dasharray:5 9;animation:scan 8s linear infinite}
    @keyframes boot{from{opacity:.25}to{opacity:1}}
    @keyframes scan{to{stroke-dashoffset:-140}}
    @media(prefers-reduced-motion:reduce){.boot,.scan{animation:none}}
  </style>
  <rect width="640" height="320" fill="#07090B"/>
  <rect x="12" y="12" width="616" height="296" rx="16" fill="#0E1417" stroke="#2C4246"/>
  <text x="28" y="36" class="mono" font-size="14" letter-spacing="1.8" fill="#8FA3A0">OPERATOR STACK</text>
  <g class="boot">
        <path d="M28 48H296L312 64V164H28Z" fill="#1C272C" stroke="#2C4246"/>
        <rect x="28" y="48" width="7" height="116" fill="#22D3EE"/>
        <text x="48" y="86" class="mono" font-size="14" letter-spacing="1.4" fill="#22D3EE">MAINTAIN  ·  GO</text>
        <text x="48" y="128" class="body" font-size="24" font-weight="800" fill="#F2F7F5">sift</text>
      </g><g class="boot">
        <path d="M328 48H596L612 64V164H328Z" fill="#1C272C" stroke="#2C4246"/>
        <rect x="328" y="48" width="7" height="116" fill="#60A5FA"/>
        <text x="348" y="86" class="mono" font-size="14" letter-spacing="1.4" fill="#60A5FA">SECURE  ·  GO</text>
        <text x="348" y="128" class="body" font-size="24" font-weight="800" fill="#F2F7F5">ironsentinel</text>
      </g><g class="boot">
        <path d="M28 176H296L312 192V292H28Z" fill="#1C272C" stroke="#2C4246"/>
        <rect x="28" y="176" width="7" height="116" fill="#22D3EE"/>
        <text x="48" y="214" class="mono" font-size="14" letter-spacing="1.4" fill="#22D3EE">FETCH  ·  RUST</text>
        <text x="48" y="256" class="body" font-size="24" font-weight="800" fill="#F2F7F5">falcon-dm</text>
      </g><g class="boot">
        <path d="M328 176H596L612 192V292H328Z" fill="#1C272C" stroke="#2C4246"/>
        <rect x="328" y="176" width="7" height="116" fill="#60A5FA"/>
        <text x="348" y="214" class="mono" font-size="14" letter-spacing="1.4" fill="#60A5FA">REMOTE  ·  RUST</text>
        <text x="348" y="256" class="body" font-size="24" font-weight="800" fill="#F2F7F5">deskward</text>
      </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="148" viewBox="0 0 960 148" role="img" aria-label="Supporting work: sift, ironsentinel, falcon-dm, deskward." data-mode="ilight">
  <defs>
    <pattern id="ilight-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#B7C6C2" stroke-width=".6" opacity=".45"/>
    </pattern>
  </defs>
  <style>
    .display{font-family:"Arial Narrow","Avenir Next Condensed",Impact,sans-serif}
    .body{font-family:"Avenir Next",Avenir,Helvetica,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .boot{animation:boot .4s ease-out}
    .scan{stroke-dasharray:5 9;animation:scan 8s linear infinite}
    @keyframes boot{from{opacity:.25}to{opacity:1}}
    @keyframes scan{to{stroke-dashoffset:-140}}
    @media(prefers-reduced-motion:reduce){.boot,.scan{animation:none}}
  </style>
  <rect width="960" height="148" fill="#D7DDD8"/>
  <rect x="12" y="12" width="936" height="124" rx="12" fill="#EEF2ED" stroke="#B7C6C2"/>
  <text x="28" y="34" class="mono" font-size="11" letter-spacing="1.8" fill="#3F534F">OPERATOR STACK</text>
  <g class="boot">
        <path d="M28 44H232L248 60V120H28Z" fill="#FFFFFF" stroke="#B7C6C2"/>
        <rect x="28" y="44" width="6" height="76" fill="#0E7490"/>
        <text x="46" y="72" class="mono" font-size="11" letter-spacing="1.4" fill="#0E7490">MAINTAIN  ·  GO</text>
        <text x="46" y="100" class="body" font-size="18" font-weight="800" fill="#122024">sift</text>
      </g><g class="boot">
        <path d="M260 44H464L480 60V120H260Z" fill="#FFFFFF" stroke="#B7C6C2"/>
        <rect x="260" y="44" width="6" height="76" fill="#1D4ED8"/>
        <text x="278" y="72" class="mono" font-size="11" letter-spacing="1.4" fill="#1D4ED8">SECURE  ·  GO</text>
        <text x="278" y="100" class="body" font-size="18" font-weight="800" fill="#122024">ironsentinel</text>
      </g><g class="boot">
        <path d="M492 44H696L712 60V120H492Z" fill="#FFFFFF" stroke="#B7C6C2"/>
        <rect x="492" y="44" width="6" height="76" fill="#0E7490"/>
        <text x="510" y="72" class="mono" font-size="11" letter-spacing="1.4" fill="#0E7490">FETCH  ·  RUST</text>
        <text x="510" y="100" class="body" font-size="18" font-weight="800" fill="#122024">falcon-dm</text>
      </g><g class="boot">
        <path d="M724 44H928L944 60V120H724Z" fill="#FFFFFF" stroke="#B7C6C2"/>
        <rect x="724" y="44" width="6" height="76" fill="#1D4ED8"/>
        <text x="742" y="72" class="mono" font-size="11" letter-spacing="1.4" fill="#1D4ED8">REMOTE  ·  RUST</text>
        <text x="742" y="100" class="body" font-size="18" font-weight="800" fill="#122024">deskward</text>
      </g>
</svg>
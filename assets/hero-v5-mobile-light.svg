<svg xmlns="http://www.w3.org/2000/svg" width="400" height="860" viewBox="0 0 400 860" role="img" aria-label="Batuhan Yüksel, software builder. Selected work: ScreenTextGrab, calder, frostwall-beam." data-mode="mlight">
  <style>
    .display{font-family:Georgia,"Times New Roman",serif}
    .body{font-family:"Avenir Next",Avenir,Helvetica,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .rise{animation:rise .45s ease-out}
    @keyframes rise{from{opacity:.2}to{opacity:1}}
    @media(prefers-reduced-motion:reduce){.rise{animation:none}}
  </style>
  <rect width="400" height="860" fill="#E6DCCF"/>
  <rect x="8" y="8" width="384" height="844" rx="22" fill="#F7F1E8"/>
  <g class="rise">
    <rect x="18" y="18" width="364" height="148" rx="18" fill="#1A1714"/>
    <rect x="18" y="40" width="4" height="40" fill="#C45C26"/>
    <text x="40" y="48" class="mono" font-size="12" letter-spacing="1.6" fill="#E8B86D">BATUHAN YÜKSEL</text>
    <text x="38" y="92" class="display" font-size="30" fill="#F7F1E8">Software</text>
    <text x="38" y="126" class="display" font-size="30" fill="#F7F1E8">builder</text>
    <text x="40" y="152" class="body" font-size="12" fill="#C4B4A4">LOCAL-FIRST APPS AND CLI TOOLS</text>
  </g>
  <g class="rise">
        <rect x="18" y="186" width="364" height="198" rx="18" fill="#FFFFFF"/>
        <text x="364" y="336" class="display" font-size="72" text-anchor="end" fill="#D9CBBA" opacity=".45">01</text>
        <text x="40" y="234" class="mono" font-size="13" letter-spacing="1.4" fill="#9A3412">CAPTURE  ·  SWIFT</text>
        <text x="40" y="286" class="body" font-size="26" font-weight="700" fill="#1A1714">ScreenTextGrab</text>
        <text x="40" y="334" class="body" font-size="16" fill="#6B5A4A">Menu bar OCR for screen, code, tables, PDFs.</text>
      </g><g class="rise">
        <rect x="18" y="400" width="364" height="198" rx="18" fill="#FFFFFF"/>
        <text x="364" y="550" class="display" font-size="72" text-anchor="end" fill="#D9CBBA" opacity=".45">02</text>
        <text x="40" y="448" class="mono" font-size="13" letter-spacing="1.4" fill="#9A3412">WORKSPACE  ·  TYPESCRIPT</text>
        <text x="40" y="500" class="body" font-size="26" font-weight="700" fill="#1A1714">calder</text>
        <text x="40" y="548" class="body" font-size="16" fill="#6B5A4A">Parallel Claude, Codex, Cursor, Antigravity.</text>
      </g><g class="rise">
        <rect x="18" y="614" width="364" height="198" rx="18" fill="#FFFFFF"/>
        <text x="364" y="764" class="display" font-size="72" text-anchor="end" fill="#D9CBBA" opacity=".45">03</text>
        <text x="40" y="662" class="mono" font-size="13" letter-spacing="1.4" fill="#9A3412">TRANSFER  ·  RUST</text>
        <text x="40" y="714" class="body" font-size="26" font-weight="700" fill="#1A1714">frostwall-beam</text>
        <text x="40" y="762" class="body" font-size="16" fill="#6B5A4A">Encrypted transfer with a receiver gate.</text>
      </g>
</svg>
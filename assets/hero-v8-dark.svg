<svg xmlns="http://www.w3.org/2000/svg" width="960" height="432" viewBox="0 0 960 432" role="img" aria-label="Batuhan Yüksel. Featured: ScreenTextGrab, calder, ironsentinel. Also falcon-dm, frostwall-beam." data-mode="dark">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#21262d" stroke-width="1" opacity=".35"/>
    </pattern>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .display,.body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
      .rise{animation:rise .45s ease-out both}
      .caret{animation:blink 1.1s step-end infinite}
      .scan{animation:scan 2.4s ease-in-out infinite alternate}
      @keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
      @keyframes blink{50%{opacity:0}}
      @keyframes scan{from{transform:translateY(0)}to{transform:translateY(8px)}}
      @media(prefers-reduced-motion:reduce){.rise,.caret,.scan{animation:none}}
    </style>
  </defs>
  <rect width="960" height="432" fill="#0d1117"/>
  <rect x="12" y="12" width="936" height="408" rx="16" fill="#0d1117" stroke="#30363d"/>
  <rect x="12" y="12" width="936" height="40" rx="16" fill="#161b22" stroke="#30363d"/>
  <rect x="12" y="38" width="936" height="16" fill="#161b22"/>
  <rect x="292" y="52" width="632" height="344" fill="url(#grid)" opacity=".45"/>

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="860" viewBox="0 0 400 860" role="img" aria-label="Batuhan Yüksel, software builder. Selected work: ScreenTextGrab, calder, frostwall-beam." data-mode="mdark">
  <defs>
    <pattern id="mdark-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2C4246" stroke-width=".6" opacity=".45"/>
    </pattern>
  </defs>
  <style>
    .display{font-family:"Arial Narrow","Avenir Next Condensed",Impact,sans-serif}
    .body{font-family:"Avenir Next",Avenir,Helvetica,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .boot{animation:boot .4s ease-out}
    .scan{stroke-dasharray:5 9;animation:scan 8s linear infinite}
    @keyframes boot{from{opacity:.25}to{opacity:1}}
    @keyframes scan{to{stroke-dashoffset:-140}}
    @media(prefers-reduced-motion:reduce){.boot,.scan{animation:none}}
  </style>
  <rect width="400" height="860" fill="#07090B"/>
  <rect x="8" y="8" width="384" height="844" rx="16" fill="#0E1417" stroke="#2C4246"/>
  <rect x="8" y="8" width="384" height="844" rx="16" fill="url(#mdark-grid)"/>
  <g class="boot">
    <path d="M18 18H366L382 34V166H18Z" fill="#151E22" stroke="#2C4246"/>
    <rect x="18" y="18" width="8" height="148" fill="#22D3EE"/>
    <text x="40" y="52" class="mono" font-size="13" letter-spacing="1.4" fill="#22D3EE">BATUHAN YÜKSEL</text>
    <text x="36" y="96" class="display" font-size="28" font-weight="900" fill="#F2F7F5">SOFTWARE</text>
    <text x="36" y="128" class="display" font-size="28" font-weight="900" fill="#F2F7F5">BUILDER</text>
    <text x="40" y="154" class="body" font-size="12" fill="#8FA3A0">LOCAL-FIRST APPS AND CLI TOOLS</text>
  </g>
  <g class="boot">
        <path d="M18 186H366L382 202V384H18Z" fill="#151E22" stroke="#2C4246"/>
        <rect x="18" y="186" width="8" height="198" fill="#22D3EE"/>
        <text x="40" y="234" class="mono" font-size="14" letter-spacing="1.2" fill="#22D3EE">01  CAPTURE  ·  SWIFT</text>
        <text x="40" y="290" class="body" font-size="26" font-weight="800" fill="#F2F7F5">ScreenTextGrab</text>
        <text x="40" y="340" class="body" font-size="16" fill="#8FA3A0">Menu bar OCR for screen, code, tables, PDFs.</text>
      </g><g class="boot">
        <path d="M18 400H366L382 416V598H18Z" fill="#151E22" stroke="#2C4246"/>
        <rect x="18" y="400" width="8" height="198" fill="#22D3EE"/>
        <text x="40" y="448" class="mono" font-size="14" letter-spacing="1.2" fill="#22D3EE">02  WORKSPACE  ·  TYPESCRIPT</text>
        <text x="40" y="504" class="body" font-size="26" font-weight="800" fill="#F2F7F5">calder</text>
        <text x="40" y="554" class="body" font-size="16" fill="#8FA3A0">Parallel Claude, Codex, Cursor, Antigravity.</text>
      </g><g class="boot">
        <path d="M18 614H366L382 630V812H18Z" fill="#151E22" stroke="#2C4246"/>
        <rect x="18" y="614" width="8" height="198" fill="#60A5FA"/>
        <text x="40" y="662" class="mono" font-size="14" letter-spacing="1.2" fill="#60A5FA">03  TRANSFER  ·  RUST</text>
        <text x="40" y="718" class="body" font-size="26" font-weight="800" fill="#F2F7F5">frostwall-beam</text>
        <text x="40" y="768" class="body" font-size="16" fill="#8FA3A0">Encrypted transfer with a receiver gate.</text>
      </g>
</svg>
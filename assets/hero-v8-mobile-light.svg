<svg xmlns="http://www.w3.org/2000/svg" width="400" height="920" viewBox="0 0 400 920" role="img" aria-label="Batuhan Yüksel. Featured: ScreenTextGrab, calder, ironsentinel." data-mode="mlight">
  <defs>

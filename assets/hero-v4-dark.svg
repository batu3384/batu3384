<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Batuhan Yüksel, software builder. Selected work: ScreenTextGrab, calder, frostwall-beam." data-mode="dark">
  <defs>
    <pattern id="dark-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2C4246" stroke-width=".6" opacity=".45"/>
    </pattern>
  </defs>
  <style>
    .display{font-family:"Arial Narrow","Avenir Next Condensed",Impact,sans-serif}
    .body{font-family:"Avenir Next",Avenir,Helvetica,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .boot{animation:boot .4s ease-out}
    .scan{stroke-dasharray:5 9;animation:scan 8s linear infinite}
    @keyframes boot{from{opacity:.25}to{opacity:1}}
    @keyframes scan{to{stroke-dashoffset:-140}}
    @media(prefers-reduced-motion:reduce){.boot,.scan{animation:none}}
  </style>
  <rect width="960" height="360" fill="#07090B"/>
  <rect x="12" y="12" width="936" height="336" rx="12" fill="#0E1417" stroke="#2C4246"/>
  <rect x="12" y="12" width="936" height="336" rx="12" fill="url(#dark-grid)"/>
  <path d="M336 92H356M336 192H356M336 292H356" fill="none" stroke="#2C4246" stroke-width="2"/>
  <path class="scan" d="M336 92H356M336 192H356M336 292H356" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
  <g class="boot">
    <path d="M28 28H316L332 44V332H28Z" fill="#151E22" stroke="#2C4246"/>
    <rect x="28" y="28" width="7" height="304" fill="#22D3EE"/>
    <text x="50" y="58" class="mono" font-size="12" letter-spacing="2" fill="#22D3EE">BATUHAN YÜKSEL</text>
    <text x="48" y="128" class="display" font-size="42" font-weight="900" letter-spacing="-1" fill="#F2F7F5">SOFTWARE</text>
    <text x="48" y="174" class="display" font-size="42" font-weight="900" letter-spacing="-1" fill="#F2F7F5">BUILDER</text>
    <text x="50" y="214" class="body" font-size="13" fill="#8FA3A0">LOCAL-FIRST APPS AND CLI TOOLS</text>
    <path d="M50 232H300" stroke="#2C4246"/>
    <text x="50" y="258" class="mono" font-size="11" letter-spacing="1.1" fill="#F2F7F5">SWIFT · GO · TS · PYTHON · RUST</text>
    <text x="50" y="302" class="mono" font-size="12" letter-spacing="1.4" fill="#22D3EE">ISTANBUL · MIS</text>
  </g>
  <g class="boot">
        <path d="M356 48H916L932 64V136H356Z" fill="#151E22" stroke="#2C4246"/>
        <rect x="356" y="48" width="7" height="88" fill="#22D3EE"/>
        <text x="380" y="76" class="mono" font-size="12" letter-spacing="1.6" fill="#22D3EE">01  CAPTURE  ·  SWIFT</text>
        <text x="380" y="104" class="body" font-size="22" font-weight="800" fill="#F2F7F5">ScreenTextGrab</text>
        <text x="380" y="124" class="body" font-size="13" fill="#8FA3A0">Menu bar OCR for screen, code, tables, PDFs.</text>
      </g><g class="boot">
        <path d="M356 148H916L932 164V236H356Z" fill="#151E22" stroke="#2C4246"/>
        <rect x="356" y="148" width="7" height="88" fill="#22D3EE"/>
        <text x="380" y="176" class="mono" font-size="12" letter-spacing="1.6" fill="#22D3EE">02  WORKSPACE  ·  TYPESCRIPT</text>
        <text x="380" y="204" class="body" font-size="22" font-weight="800" fill="#F2F7F5">calder</text>
        <text x="380" y="224" class="body" font-size="13" fill="#8FA3A0">Parallel Claude, Codex, Cursor, Antigravity.</text>
      </g><g class="boot">
        <path d="M356 248H916L932 264V336H356Z" fill="#151E22" stroke="#2C4246"/>
        <rect x="356" y="248" width="7" height="88" fill="#60A5FA"/>
        <text x="380" y="276" class="mono" font-size="12" letter-spacing="1.6" fill="#60A5FA">03  TRANSFER  ·  RUST</text>
        <text x="380" y="304" class="body" font-size="22" font-weight="800" fill="#F2F7F5">frostwall-beam</text>
        <text x="380" y="324" class="body" font-size="13" fill="#8FA3A0">Encrypted transfer with a receiver gate.</text>
      </g>
</svg>
        <circle cx="34" cy="224" r="4" fill="#DEA584"/>
        <text x="46" y="228" class="mono" font-size="12" fill="#9198a1">Rust</text>
        <text x="34" y="284" class="body" font-size="16" font-weight="600" fill="#4493f8">frostwall-beam</text>
      </g><g class="rise">
        <rect x="206" y="196" width="176" height="136" rx="6" fill="#161b22" stroke="#3d444d"/>
        <circle cx="222" cy="224" r="4" fill="#F34B7D"/>
        <text x="234" y="228" class="mono" font-size="12" fill="#9198a1">C++</text>
        <text x="222" y="284" class="body" font-size="16" font-weight="600" fill="#4493f8">byteback</text>

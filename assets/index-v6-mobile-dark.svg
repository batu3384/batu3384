        <text x="34" y="136" class="body" font-size="16" font-weight="600" fill="#4493f8">sift</text>
      </g><g class="rise">
        <rect x="206" y="48" width="176" height="136" rx="6" fill="#161b22" stroke="#3d444d"/>
        <circle cx="222" cy="76" r="4" fill="#DEA584"/>
        <text x="234" y="80" class="mono" font-size="12" fill="#9198a1">Rust</text>
        <text x="222" y="136" class="body" font-size="16" font-weight="600" fill="#4493f8">falcon-dm</text>
      </g><g class="rise">

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Batuhan Yüksel, Software developer. ScreenTextGrab, calder, ironsentinel, falcon-dm, frostwall-beam." data-mode="light">
  <defs>
    <clipPath id="frame"><rect width="960" height="360" rx="22"/></clipPath>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.65" fill="#9a5a14" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <style>
    .display{font-family:Georgia,"Times New Roman",Times,serif}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <g clip-path="url(#frame)">
    <rect width="960" height="360" fill="#f4efe4"/>
    <rect width="960" height="360" fill="url(#g)"/>
    <rect width="332" height="360" fill="#c48432"/>
    <circle cx="332" cy="210" r="150" fill="#1a140c" fill-opacity="0.08"/>
    <text x="36" y="48" class="mono" font-size="11" letter-spacing="2.8" fill="#5c3a10">SOFTWARE</text>
    <text x="36" y="142" class="display" font-size="44" fill="#1a140c">Batuhan</text>
    <text x="36" y="194" class="display" font-size="44" fill="#1a140c">Yüksel</text>
    <text x="36" y="236" class="sans" font-size="15" fill="#1a140c">Software developer</text>
    <text x="36" y="328" class="mono" font-size="12" fill="#5c3a10">Istanbul · MIS</text>
    <text x="368" y="44" class="sans" font-size="13" fill="#1a1612">macOS applications · CLI tools · application security</text>
    <line x1="368" y1="64" x2="932" y2="64" stroke="#e2d8c6" stroke-width="1"/>
    <text x="368" y="96" class="mono" font-size="11" fill="#9a5a14">01</text>
    <text x="396" y="96" class="sans" font-size="15" font-weight="600" fill="#1a1612">ScreenTextGrab</text>
    <text x="396" y="114" class="sans" font-size="12" fill="#6d6458">On-device OCR for screen, PDFs, code, and tables.</text>
    <text x="368" y="138" class="mono" font-size="11" fill="#9a5a14">02</text>
    <text x="396" y="138" class="sans" font-size="15" font-weight="600" fill="#1a1612">calder</text>
    <text x="396" y="156" class="sans" font-size="12" fill="#6d6458">Parallel Claude Code, Codex, Cursor, and Antigravity.</text>
    <text x="368" y="180" class="mono" font-size="11" fill="#9a5a14">03</text>
    <text x="396" y="180" class="sans" font-size="15" font-weight="600" fill="#1a1612">ironsentinel</text>
    <text x="396" y="198" class="sans" font-size="12" fill="#6d6458">Guided scans, runtime trust checks, evidence reports.</text>
    <text x="368" y="222" class="mono" font-size="11" fill="#9a5a14">04</text>
    <text x="396" y="222" class="sans" font-size="15" font-weight="600" fill="#1a1612">falcon-dm</text>
    <text x="396" y="240" class="sans" font-size="12" fill="#6d6458">HTTP, HLS, and YouTube — native macOS, local queue.</text>
    <text x="368" y="264" class="mono" font-size="11" fill="#9a5a14">05</text>
    <text x="396" y="264" class="sans" font-size="15" font-weight="600" fill="#1a1612">frostwall-beam</text>
    <text x="396" y="282" class="sans" font-size="12" fill="#6d6458">Encrypted transfer with pairing and receiver approval.</text>
    <line x1="368" y1="314" x2="932" y2="314" stroke="#e2d8c6" stroke-width="1"/>
    <rect x="368" y="319" width="58" height="22" rx="11" fill="#fffaf1"/>
    <text x="397" y="335" class="mono" font-size="11" text-anchor="middle" fill="#6d6458">Swift</text>
    <rect x="434" y="319" width="40" height="22" rx="11" fill="#fffaf1"/>
    <text x="454" y="335" class="mono" font-size="11" text-anchor="middle" fill="#6d6458">Go</text>
    <rect x="482" y="319" width="92" height="22" rx="11" fill="#fffaf1"/>
    <text x="528" y="335" class="mono" font-size="11" text-anchor="middle" fill="#6d6458">TypeScript</text>
    <rect x="582" y="319" width="52" height="22" rx="11" fill="#fffaf1"/>
    <text x="608" y="335" class="mono" font-size="11" text-anchor="middle" fill="#6d6458">Rust</text>
    <rect x="642" y="319" width="70" height="22" rx="11" fill="#fffaf1"/>
    <text x="677" y="335" class="mono" font-size="11" text-anchor="middle" fill="#6d6458">Python</text>
    <rect x="720" y="319" width="46" height="22" rx="11" fill="#fffaf1"/>
    <text x="743" y="335" class="mono" font-size="11" text-anchor="middle" fill="#6d6458">C++</text>
  </g>
</svg>
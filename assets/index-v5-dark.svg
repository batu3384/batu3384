<svg xmlns="http://www.w3.org/2000/svg" width="960" height="148" viewBox="0 0 960 148" role="img" aria-label="Supporting work: sift, ironsentinel, falcon-dm, deskward." data-mode="idark">
  <style>
    .display{font-family:Georgia,"Times New Roman",serif}
    .body{font-family:"Avenir Next",Avenir,Helvetica,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .rise{animation:rise .45s ease-out}
    @keyframes rise{from{opacity:.2}to{opacity:1}}
    @media(prefers-reduced-motion:reduce){.rise{animation:none}}
  </style>
  <rect width="960" height="148" fill="#12100E"/>
  <rect x="12" y="12" width="936" height="124" rx="20" fill="#1A1714"/>
  <text x="28" y="36" class="mono" font-size="11" letter-spacing="2" fill="#B7A798">OPERATOR STACK</text>
  <g class="rise">
        <rect x="28" y="44" width="220" height="76" rx="14" fill="#2A241F"/>
        <rect x="44" y="44" width="188" height="3" fill="#C45C26"/>
        <text x="44" y="76" class="mono" font-size="11" letter-spacing="1.6" fill="#E8B86D">MAINTAIN  ·  GO</text>
        <text x="44" y="104" class="body" font-size="18" font-weight="700" fill="#F6EFE6">sift</text>
      </g><g class="rise">
        <rect x="260" y="44" width="220" height="76" rx="14" fill="#2A241F"/>
        <rect x="276" y="44" width="188" height="3" fill="#C45C26"/>
        <text x="276" y="76" class="mono" font-size="11" letter-spacing="1.6" fill="#E8B86D">SECURE  ·  GO</text>
        <text x="276" y="104" class="body" font-size="18" font-weight="700" fill="#F6EFE6">ironsentinel</text>
      </g><g class="rise">
        <rect x="492" y="44" width="220" height="76" rx="14" fill="#2A241F"/>
        <rect x="508" y="44" width="188" height="3" fill="#C45C26"/>
        <text x="508" y="76" class="mono" font-size="11" letter-spacing="1.6" fill="#E8B86D">FETCH  ·  RUST</text>
        <text x="508" y="104" class="body" font-size="18" font-weight="700" fill="#F6EFE6">falcon-dm</text>
      </g><g class="rise">
        <rect x="724" y="44" width="220" height="76" rx="14" fill="#2A241F"/>
        <rect x="740" y="44" width="188" height="3" fill="#C45C26"/>
        <text x="740" y="76" class="mono" font-size="11" letter-spacing="1.6" fill="#E8B86D">REMOTE  ·  RUST</text>
        <text x="740" y="104" class="body" font-size="18" font-weight="700" fill="#F6EFE6">deskward</text>
      </g>
</svg>